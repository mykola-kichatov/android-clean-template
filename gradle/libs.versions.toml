[versions]
agp = "9.0.1"
androidxTest = "1.3.0"
# The runner of AndroidX Test, numbered apart from androidx.test.ext:junit above.
androidxTestRunner = "1.7.0"
# Byte Buddy's agent jar. Must stay in step with the byte-buddy that `mockk` resolves; see
# UnitTestsPlugin, which passes it to every test JVM as -javaagent.
byteBuddy = "1.18.2"
coil = "2.7.0"
composeBom = "2026.02.01"
coreSplashscreen = "1.2.0"
coroutines = "1.10.2"
datastore = "1.2.1"
espresso = "3.7.0"
hilt = "2.59.2"
hiltNavCompose = "1.3.0"
javaxInject = "1"
jUnit5 = "6.0.3"
kotlin = "2.3.10"
# Each release needs the kotlin-stdlib of the Kotlin version it is built for: 1.10.0 needs 2.3.0,
# 1.11.0 needs 2.3.20. Keep it on a release built for `kotlin` or an older Kotlin.
kotlinxSerialization = "1.10.0"
ksp = "2.3.2"
ktlintGradle = "14.2.0"
ktx = "1.17.0"
lifecycle = "2.10.0"
mockk = "1.14.9"
navigation = "2.9.7"
retrofit = "3.0.0"
room = "2.8.5"
turbine = "1.2.1"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation" }
androidx-room = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
byte-buddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byteBuddy" }
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
compose-activity = { group = "androidx.activity", name = "activity-compose" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavCompose" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit5-bom = { group = "org.junit", name = "junit-bom", version.ref = "jUnit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit5-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

#Important: these Gradle plugins are used in :build-logic and are therefore defined here instead of under [plugins]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
hilt-android-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }

[plugins]
app = { id = "com.mkchtv.convention.app" }
domain = { id = "com.mkchtv.convention.domain" }
data = { id = "com.mkchtv.convention.data" }
ui = { id = "com.mkchtv.convention.ui" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

[bundles]
androidTesting = [
    "androidx-test-ext",
    "androidx-test-espresso-core",
    "androidx-navigation-testing",
    "compose-ui-test-junit4",
]
# Device tests of data modules: the JUnit 4 runner and Room's MigrationTestHelper, no Compose.
dataAndroidTesting = [
    "androidx-test-ext",
    "androidx-test-runner",
    "androidx-room-testing",
]
unitTesting = [
    "junit5-api",
    "mockk",
    "kotlinx-coroutines-test",
]
